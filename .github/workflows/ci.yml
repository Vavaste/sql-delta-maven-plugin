name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (JDK ${{ matrix.java }}, ${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
        stack: [boot4, hibernate6]
        include:
          # Spring Boot 4 / Hibernate 7, unit tests on H2 and on PostgreSQL 18 (Testcontainers uses the runner's Docker)
          - stack: boot4
            args: ''
          # the engine compiled and unit tested against Spring Boot 3.5 / Hibernate 6.6
          - stack: hibernate6
            args: -Phibernate6
          # the unit tests on the oldest supported PostgreSQL
          - java: '17'
            stack: postgres15
            args: -Dsqldelta.test.postgres.image=postgres:15
          # the engine compiled and unit tested against liquibase-core 5.x, which users can pick with liquibaseVersion
          - java: '17'
            stack: liquibase5
            args: -Dliquibase.version=5.0.4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Cache the local Maven repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Build and test
        run: ./mvnw -B -ntp verify ${{ matrix.args }}
